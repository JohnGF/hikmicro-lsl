[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hikmicro-lsl"
version = "0.1.0"
description = "Stream HIKMICRO Pocket 2 / XTherm thermal camera frames into Lab Streaming Layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bci_projects" }]
dependencies = [
    "numpy>=1.26",
    "pylsl>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
ui = [
    "PySide6>=6.11",
    "pyqtgraph>=0.14",
]
wells = [
    "opencv-python-headless>=4.9",
    "pandas>=2.0",
]
web = [
    "opencv-python-headless>=4.9",
]

[project.scripts]
hikmicro-lsl = "hikmicro_lsl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hikmicro_lsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
